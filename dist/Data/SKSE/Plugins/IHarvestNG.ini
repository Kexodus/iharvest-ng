; IHarvest NG settings. Also editable in-game via SKSE Menu Framework (IHarvest NG > Settings).
; Defaults reproduce the original IHarvest MCM defaults.

[General]
; 0 trace, 1 debug, 2 info, 3 warn, 4 error, 5 critical, 6 off
iLogLevel = 2

[Casting]
; Magicka drained per wisp sent (spell). Reduced by Alteration cost reduction, never below 15%.
fMagickaCostPerWisp = 8.0
; Enchantment charge drained per wisp sent (Staff of Harvest).
fStaffChargePerWisp = 12.0
; Alteration skill-use XP per wisp sent (player only).
fXPPerWisp = 10.0
; Maximum wisps in flight at once (1-128).
iMaxWisps = 64
; Multiplier on the skill-based search radius (1.0 = original).
fRadiusMult = 1.0
; NPCs who cast Harvest / use the staff send wisps too.
bAllowNPCCasters = true
; Dual casting with the Alteration Dual Casting perk sends two wisps at a time (each costs magicka).
bDualCastPerkDoubleWisps = true

[Harvest]
; Also harvest loose food and plants that only yield food.
bFood = false
; Harvest Hearthfire garden planters.
bHearthfire = true
; Catch butterflies, moths, dragonflies, fish, and harvest nirnroot, poison blooms etc.
bCritters = true
; Also collect loose and recoverable arrows/bolts.
bArrows = false
; Never take anything that would count as stealing.
bRespectOwnership = true

[Wisps]
; -3..3. Wisps appear this far in front of you (x192 units); negative = behind you.
fSpawnDistanceMult = 1.0
; How close to you (192-1000 units) wisps return before vanishing.
fReturnOffset = 192.0
; Wisp flight speed multiplier (0.25-20).
fSpeedMult = 1.0
; Wisp hum and despawn sound.
bSounds = true

[SpellTomes]
; Chance that a placed Spell Tome: Harvest disappears once you already know the spell.
fReadTomeDespawnChance = 0.8
